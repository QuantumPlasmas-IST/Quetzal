;File info
FILENAME "./output/dispersion_2DLin.h5";
POS_DIAG_FREQ 25;
MOM_DIAG_FREQ 200;
;Simulation Domain
POS_DIMS 1;
MOM_DIMS 2;
POS_POINTS 256;
MOM_POINTS 25, 25;
POS_MIN -32;
POS_MAX 32;
MOM_MIN -0.4,-0.4;
MOM_MAX 0.4,0.4;
POS_BOUND "periodic";
MOM_BOUND "dirichelet", "dirichelet";
;Species
N_SPECIES 2;
DISP "linear", "linear";
POS_INIT "double gaussian", "double gaussian";
POS_PARAMS 0.9998615270, 1000, 0, 0.1, 0.05, 0, 1, 1000, 0, 0.0, 0.05, 1;
MOM_INIT "linear fermi", "linear fermi";
MOM_PARAMS 0.05, 0.05, 0, 0, -0.05, 0.05, 0, 0;
;Fields
N_FIELDS 1;
TYPE "static";
KERNEL "2Dpoisson";
SOURCE_CHARGES 1, -1;
SOURCE_MOMENTS 0, 0;
DYNAMICS "none";
FORCE "gradient";
FORCE_CHARGES 1, -1;
FIELD_INIT "gaussian";
FIELD_PARAMS 1, 200, 0;
;Algorithm parameters
PUSHER "runge kutta";
OPER "finite volume";
N_TIMESTEPS 100000;
DELTAT 0.02;
PADDING 2;
PROCS 1;