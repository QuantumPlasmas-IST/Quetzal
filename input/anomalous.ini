;File info
FILENAME "./output/anomalous_warm.h5";
DIAG_FREQ 50;
;Simulation Domain
POS_DIMS 2;
MOM_DIMS 1;
POS_POINTS 256, 128;
MOM_POINTS 50;
POS_MIN -55,-27.5;
POS_MAX 55,27.5;
MOM_MIN -0.7;
MOM_MAX 0.7;
POS_BOUND "periodic", "periodic";
MOM_BOUND "dirichelet";
;Species
N_SPECIES 2;
DISP "quadratic", "quadratic";
POS_INIT "noise", "noise";
POS_PARAMS 1, 0.1, 1, 0.1;
MOM_INIT "quadratic fermi", "quadratic fermi";
MOM_PARAMS 0, 0.01, 0.1766, 0, 0.01, -0.1766;
;Fields
N_FIELDS 1;
KERNEL "2Dpoisson";
FORCE "gradient";
FIELD_INIT "gaussian";
FIELD_PARAMS 1, 200, 0, 0;
CHARGES 1, -1;
;Algorithm parameters
PUSHER "runge kutta";
OPER "finite volume";
N_TIMESTEPS 12000;
DELTAT 0.02;
PADDING 2;