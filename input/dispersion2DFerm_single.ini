;File info
FILENAME "./output/dispersion_2DFerm5_single.h5";
POS_DIAG_FREQ 25;
MOM_DIAG_FREQ 200;
;Simulation Domain
POS_DIMS 1;
MOM_DIMS 1;
POS_POINTS 512;
MOM_POINTS 100;
POS_MIN -32;
POS_MAX 32;
MOM_MIN -1.2;
MOM_MAX 1.2;
POS_BOUND "periodic";
MOM_BOUND "dirichelet";
;Species
N_SPECIES 1;
DISP "quadratic";
POS_INIT "double gaussian";
POS_PARAMS 0.9998615270, 1000, 0, 0.1, 0.05, 0;
MOM_INIT "flattened quadratic fermi";
MOM_PARAMS 0.3, 0.01, 0;
;Fields
N_FIELDS 1;
TYPE "static";
KERNEL "2Dpoisson";
SOURCE_CHARGES 1;
SOURCE_MOMENTS 0;
DYNAMICS "none";
FORCE "gradient";
FORCE_CHARGES 1;
FIELD_INIT "gaussian";
FIELD_PARAMS 1, 200, 0;
;Algorithm parameters
PUSHER "runge kutta";
OPER "finite volume";
N_TIMESTEPS 100000;
DELTAT 0.02;
PADDING 2;
PROCS 1;